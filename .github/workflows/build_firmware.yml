name: Build ChromeBoy FM-1 Firmware
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Install JieLi Toolchain 2.5.3
        shell: pwsh
        run: |
          curl.exe -L -o jieli_toolchain.zip "https://pkgman.jieliapp.com/s/linux-toolchain/jieli-c-pi32v2-2.5.3.zip" -f -s
          if (!(Test-Path "jieli_toolchain.zip")) {
            Invoke-WebRequest -Uri "https://github.com/m-vave/fm1_open/releases/download/v14/pi32-toolchain-2.5.3.zip" -OutFile "jieli_toolchain.zip"
          }
          Expand-Archive -Path "jieli_toolchain.zip" -DestinationPath "C:\JL\"
          Write-Host "JieLi Toolchain ready at C:\JL\pi32"

      - name: Compile Cold Chrome Firmware
        shell: pwsh
        run: |
          $env:FM1_PI32_TOOLCHAIN = "C:\JL\pi32"
          if (Test-Path "./sdk/Build.ps1") {
            powershell -ExecutionPolicy Bypass -File "./sdk/Build.ps1" -FirmwareOnly -Toolchain "C:\JL\pi32"
          } else {
            cmd.exe /c "build.bat --package"
          }

      - name: Upload Flashable .fwsc Binary
        uses: actions/upload-artifact@v4
        with:
          name: ColdChrome_FM1_Firmware
          path: build/dx7/generated/*.fwsc
